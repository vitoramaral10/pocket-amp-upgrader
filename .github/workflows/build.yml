name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            artifact: pocket-amp-upgrader-linux-x64.tar.gz
          - os: windows-latest
            target: windows
            artifact: pocket-amp-upgrader-windows-x64.zip
          - os: macos-latest
            target: macos
            artifact: pocket-amp-upgrader-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - run: flutter build ${{ matrix.target }} --release

      - name: Package (Linux)
        if: matrix.target == 'linux'
        run: |
          mv build/linux/x64/release/bundle pocket-amp-upgrader
          tar czf ${{ matrix.artifact }} pocket-amp-upgrader
          curl -sfL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          linux/packaging/build-appimage.sh pocket-amp-upgrader ./appimagetool Pocket_AMP_Upgrader-x86_64.AppImage

      - name: Upload AppImage
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: Pocket_AMP_Upgrader-x86_64.AppImage
          path: Pocket_AMP_Upgrader-x86_64.AppImage
          if-no-files-found: error

      - name: Package (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          Rename-Item build/windows/x64/runner/Release pocket-amp-upgrader
          # App-local Visual C++ runtime, so the app starts on machines without
          # the redistributable installed.
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build/windows/x64/runner/pocket-amp-upgrader/
          }
          Compress-Archive -Path build/windows/x64/runner/pocket-amp-upgrader -DestinationPath ${{ matrix.artifact }}

      - name: Package (macOS)
        if: matrix.target == 'macos'
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/Pocket AMP Upgrader.app" ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
