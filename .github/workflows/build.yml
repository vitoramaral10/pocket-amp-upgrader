name: build

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  build:
    needs: test
    # PRs only run the tests; the builds run after the merge.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            artifact: pocket-amp-tools-linux-x64.tar.gz
          - os: windows-latest
            target: windows
            artifact: pocket-amp-tools-windows-x64.zip
          - os: macos-latest
            target: macos
            artifact: pocket-amp-tools-macos.zip
          - os: ubuntu-latest
            target: apk
            artifact: pocket-amp-tools-android.apk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Linux build dependencies
        if: matrix.target == 'linux'
        # A stuck mirror once held this step for over 20 minutes.
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y ninja-build libgtk-3-dev libcurl4-openssl-dev

      # Reports stay off in builds without the secret (forks, pull requests).
      - run: flutter build ${{ matrix.target }} --release --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: Package (Linux)
        if: matrix.target == 'linux'
        run: |
          mv build/linux/x64/release/bundle pocket-amp-tools
          tar czf ${{ matrix.artifact }} pocket-amp-tools
          # Both downloads are pinned by checksum: the runtime becomes the
          # first code the shipped AppImage runs.
          curl -sfL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -sfL -o runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          sha256sum -c - <<'SUMS'
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime-x86_64
          SUMS
          chmod +x appimagetool
          RUNTIME_FILE="$PWD/runtime-x86_64" linux/packaging/build-appimage.sh pocket-amp-tools ./appimagetool Pocket_AMP_Tools-x86_64.AppImage

      - name: Upload AppImage
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Pocket_AMP_Tools-x86_64.AppImage
          path: Pocket_AMP_Tools-x86_64.AppImage
          if-no-files-found: error

      - name: Package (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          Rename-Item build/windows/x64/runner/Release pocket-amp-tools
          # App-local Visual C++ runtime, so the app starts on machines without
          # the redistributable installed.
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build/windows/x64/runner/pocket-amp-tools/
          }
          Compress-Archive -Path build/windows/x64/runner/pocket-amp-tools -DestinationPath ${{ matrix.artifact }}

      - name: Package (macOS)
        if: matrix.target == 'macos'
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/Pocket AMP Tools.app" ${{ matrix.artifact }}

      - name: Package (Android)
        if: matrix.target == 'apk'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Gradle leaves the APK unsigned, as F-Droid needs it; the copy on
          # the releases page is signed here. Without the secrets (a fork)
          # this step fails rather than ship an APK nobody can install.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          "$apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-pass env:KEYSTORE_PASSWORD \
            --out ${{ matrix.artifact }} build/app/outputs/flutter-apk/app-release.apk
          rm "$RUNNER_TEMP/release.p12"
          "$apksigner" verify --print-certs ${{ matrix.artifact }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      # Lets anyone check a download was built here: gh attestation verify
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
