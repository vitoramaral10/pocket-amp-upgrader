name: Bug report
description: Something went wrong while detecting or updating the pedal.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! If the pedal is stuck, **keep it connected** and see "If it stops halfway" in the README before trying anything else.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: System version
      placeholder: e.g. Windows 11 23H2, macOS 15.1, Ubuntu 24.04
  - type: input
    id: app_version
    attributes:
      label: App version
      placeholder: e.g. v0.1.0-beta.1
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware on the pedal before, and the file you used
      placeholder: e.g. 1.03 -> official Pocket AMP V1.05 download
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what did you see?
    validations:
      required: true
  - type: dropdown
    id: state
    attributes:
      label: State of the pedal now
      options:
        - Works normally
        - Stuck in update mode (the app shows "update mode")
        - Does not turn on or is not detected
        - Not sure
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: App log
      description: In the app, open **Details** and click **Copy for a bug report**, then paste here.
      render: text
    validations:
      required: true
